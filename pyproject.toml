[project]
name = "workorder-factory"
version = "0.1.0"
description = "A work-order software factory prototype: human-owned intent and invariants, agents in sandboxes, independent gates, hash-chained audit ledger."
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.1", "rich>=13", "pytest>=8", "hypothesis>=6", "bandit>=1.7", "anyio>=4", "mcp>=1.2"]

[project.scripts]
wo = "factory.cli:main"
wo-mcp = "factory.mcp_server:main"

[tool.setuptools]
packages = ["factory"]

[tool.setuptools.package-data]
factory = ["prompts/*.md", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
